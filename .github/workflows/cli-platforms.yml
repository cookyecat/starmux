name: Build packages
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm pack
      - name: Build macOS App
        if: runner.os == 'macOS'
        run: |
          python3 app/scripts/build_ui.py --output-dir "${{ runner.temp }}/starmux-ui"
