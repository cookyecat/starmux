name: Build packages
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        node: ['22.12.0', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:package
      - name: Build macOS App
        if: runner.os == 'macOS'
        run: |
          python3 app/scripts/build_ui.py --output-dir ".internal/starmux-ui"

  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/dashboard-browser.smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-screenshots
          path: .internal/playwright
          include-hidden-files: true
