<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 320" width="1672" height="320" role="img" aria-labelledby="vs-title vs-desc">
  <title id="vs-title">Traditional Fragmented DIY MCP Stack vs. Starmux Single 'starmux up' Daemon</title>
  <desc id="vs-desc">Comparison diagram showing how Starmux replaces four separate DIY components (File/Terminal MCP, stdio-to-HTTP Bridge, Auth/Aggregator Gateway, and Process Supervisor) with a single 'starmux up' self-hosted daemon.</desc>
  <defs>
    <linearGradient id="bgPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfdff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <linearGradient id="diyBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffafa"/>
      <stop offset="1" stop-color="#fff2f2"/>
    </linearGradient>
    <linearGradient id="starmuxBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f5ef7"/>
      <stop offset="0.55" stop-color="#1877f2"/>
      <stop offset="1" stop-color="#0ca678"/>
    </linearGradient>
    <linearGradient id="starmuxCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f7ff"/>
      <stop offset="0.6" stop-color="#ecf6ff"/>
      <stop offset="1" stop-color="#e8fbf5"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feComponentTransfer in="offset" result="dim">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dim"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Outer background container -->
  <rect x="0" y="0" width="1672" height="320" rx="18" fill="#ffffff"/>
  <rect x="12" y="12" width="1648" height="296" rx="16" fill="url(#bgPanel)" stroke="#e2eaf6" stroke-width="1.5"/>

  <!-- ==================== ROW 1: TRADITIONAL DIY STACK ==================== -->
  <g id="row-diy">
    <!-- Left label -->
    <rect x="34" y="34" width="286" height="106" rx="12" fill="#fff5f5" stroke="#f5c2c7" stroke-width="1.4"/>
    <circle cx="58" cy="66" r="11" fill="#fde2e4"/>
    <path d="M 53.5 61.5 L 62.5 70.5 M 62.5 61.5 L 53.5 70.5" stroke="#d92d20" stroke-width="2.4" stroke-linecap="round"/>
    <text x="78" y="72" fill="#7a1c1c" font-size="20" font-weight="760">Traditional DIY Stack</text>
    <text x="50" y="100" fill="#9e3a3a" font-size="14.5" font-weight="500">Assemble &amp; maintain 4 separate</text>
    <text x="50" y="120" fill="#9e3a3a" font-size="14.5" font-weight="500">tools, configs, ports &amp; scripts</text>

    <!-- Box 1: File/Terminal MCP -->
    <rect x="348" y="34" width="290" height="106" rx="12" fill="url(#diyBox)" stroke="#e6a8a8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="493" y="68" fill="#5c1f1f" font-size="18" font-weight="720" text-anchor="middle">1. File / Terminal MCP</text>
    <text x="493" y="94" fill="#8c4343" font-size="14" font-weight="500" text-anchor="middle" class="mono">DesktopCommanderMCP</text>
    <text x="493" y="116" fill="#a65656" font-size="13" font-weight="500" text-anchor="middle">(stdio only · built-in telemetry)</text>

    <!-- Plus 1 -->
    <circle cx="659" cy="87" r="14" fill="#fbe9e9" stroke="#e6a8a8" stroke-width="1.2"/>
    <text x="659" y="94" fill="#9e3a3a" font-size="21" font-weight="750" text-anchor="middle">+</text>

    <!-- Box 2: stdio-to-HTTP Bridge -->
    <rect x="680" y="34" width="290" height="106" rx="12" fill="url(#diyBox)" stroke="#e6a8a8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="825" y="68" fill="#5c1f1f" font-size="18" font-weight="720" text-anchor="middle">2. stdio-to-HTTP Bridge</text>
    <text x="825" y="94" fill="#8c4343" font-size="14" font-weight="500" text-anchor="middle" class="mono">supergateway / mcp-proxy</text>
    <text x="825" y="116" fill="#a65656" font-size="13" font-weight="500" text-anchor="middle">(extra adapter process &amp; port)</text>

    <!-- Plus 2 -->
    <circle cx="991" cy="87" r="14" fill="#fbe9e9" stroke="#e6a8a8" stroke-width="1.2"/>
    <text x="991" y="94" fill="#9e3a3a" font-size="21" font-weight="750" text-anchor="middle">+</text>

    <!-- Box 3: Auth & Aggregator -->
    <rect x="1012" y="34" width="300" height="106" rx="12" fill="url(#diyBox)" stroke="#e6a8a8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="1162" y="68" fill="#5c1f1f" font-size="18" font-weight="720" text-anchor="middle">3. Auth &amp; Aggregator</text>
    <text x="1162" y="94" fill="#8c4343" font-size="14" font-weight="500" text-anchor="middle" class="mono">MCPHub / Caddy / Proxy</text>
    <text x="1162" y="116" fill="#a65656" font-size="13" font-weight="500" text-anchor="middle">(manual routing &amp; token proxy)</text>

    <!-- Plus 3 -->
    <circle cx="1333" cy="87" r="14" fill="#fbe9e9" stroke="#e6a8a8" stroke-width="1.2"/>
    <text x="1333" y="94" fill="#9e3a3a" font-size="21" font-weight="750" text-anchor="middle">+</text>

    <!-- Box 4: Process Supervisor -->
    <rect x="1354" y="34" width="284" height="106" rx="12" fill="url(#diyBox)" stroke="#e6a8a8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="1496" y="68" fill="#5c1f1f" font-size="18" font-weight="720" text-anchor="middle">4. Process Supervisor</text>
    <text x="1496" y="94" fill="#8c4343" font-size="14" font-weight="500" text-anchor="middle" class="mono">pm2 / systemd / Docker</text>
    <text x="1496" y="116" fill="#a65656" font-size="13" font-weight="500" text-anchor="middle">(keep-alive &amp; lifecycle wiring)</text>
  </g>

  <!-- ==================== ROW 2: STARMUX ALL-IN-ONE ==================== -->
  <g id="row-starmux">
    <!-- Left label -->
    <rect x="34" y="164" width="286" height="122" rx="12" fill="#eaf4ff" stroke="#7fb8ff" stroke-width="1.6"/>
    <circle cx="58" cy="198" r="11" fill="#d1fae5"/>
    <path d="M 52.5 198.5 L 56.5 202.5 L 64 194" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="204" fill="#091540" font-size="21" font-weight="780">Starmux (All-in-One)</text>
    <text x="50" y="234" fill="#1d4ed8" font-size="15" font-weight="620">One turnkey self-hosted daemon</text>
    <text x="50" y="256" fill="#3b5998" font-size="14" font-weight="500">Zero manual assembly · Zero telemetry</text>

    <!-- Unified All-in-One Bar -->
    <rect x="348" y="164" width="1290" height="122" rx="14" fill="url(#starmuxCard)" stroke="#298cff" stroke-width="2.2" filter="url(#cardShadow)"/>

    <!-- Top Hero Pill inside Unified Bar -->
    <rect x="598" y="179" width="790" height="46" rx="10" fill="url(#starmuxBanner)"/>
    <text x="993" y="209" fill="#ffffff" font-size="22" font-weight="780" text-anchor="middle" class="mono">Single 'starmux up' Daemon   (http://127.0.0.1:18893/mcp)</text>

    <!-- 4 Aligned Built-in Capability Pills matching the 4 DIY columns above -->
    <rect x="366" y="238" width="254" height="34" rx="8" fill="#ffffff" stroke="#b8d8ff" stroke-width="1.2"/>
    <text x="493" y="260" fill="#0f4c9c" font-size="14" font-weight="650" text-anchor="middle">✓  Built-in File, Shell &amp; Git Tools</text>

    <rect x="680" y="238" width="290" height="34" rx="8" fill="#ffffff" stroke="#b8d8ff" stroke-width="1.2"/>
    <text x="825" y="260" fill="#0f4c9c" font-size="14" font-weight="650" text-anchor="middle">✓  Native Streamable HTTP &amp; LAN</text>

    <rect x="1012" y="238" width="300" height="34" rx="8" fill="#ffffff" stroke="#a7e9d5" stroke-width="1.2"/>
    <text x="1162" y="260" fill="#066a4e" font-size="14" font-weight="650" text-anchor="middle">✓  Multi-MCP Gateway &amp; Auth</text>

    <rect x="1364" y="238" width="256" height="34" rx="8" fill="#ffffff" stroke="#a7e9d5" stroke-width="1.2"/>
    <text x="1492" y="260" fill="#066a4e" font-size="14" font-weight="650" text-anchor="middle">✓  Daemon &amp; Read-Only Gate</text>
  </g>
</svg>
