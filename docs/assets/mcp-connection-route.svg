<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">Mac MCP Gateway: two remote connection routes to one local MCP server</title>
  <desc id="description">Two explicit routes are shown in parallel. Preferred Direct HTTPS: ChatGPT connects to the owner's DNS name, authenticated HTTPS reverse proxy and single Gateway Core. Alternative Secure MCP Tunnel: ChatGPT uses an OpenAI-hosted Tunnel with an outbound client on the Mac. Both routes reach the same Gateway, which forwards MCP calls to the real local Desktop Commander server. Architecture only; external authorization tests remain pending.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111728"/><stop offset=".57" stop-color="#17233b"/><stop offset="1" stop-color="#0c2631"/>
    </linearGradient>
    <linearGradient id="direct" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#183b43"/><stop offset="1" stop-color="#153045"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#292849"/><stop offset="1" stop-color="#1c3151"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#253b60"/><stop offset="1" stop-color="#1a2e4b"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto">
      <path d="M1 1 L5.7 3.5 L1 6" stroke="#5cddc3" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
    </marker>
    <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto">
      <path d="M1 1 L5.7 3.5 L1 6" stroke="#82a9ff" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
    </marker>
  </defs>

  <rect width="1200" height="450" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="448" rx="21" fill="none" stroke="#4c607b" stroke-opacity=".68"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="34" y="45" fill="#f7fbff" font-size="25" font-weight="750">Two ways to reach your Mac. One Gateway you control.</text>
    <text x="34" y="73" fill="#a5bbd1" font-size="14">Both options use the real local Desktop Commander MCP server — no reimplementation of its tools.</text>
  </g>

  <!-- One AI client, two explicit paths, one gateway -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M234 232 H265 V167 H293" stroke="#5cddc3" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <path d="M265 232 V312 H293" stroke="#82a9ff" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M773 167 H800 V232 H823" stroke="#5cddc3" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <path d="M773 312 H800 V232" stroke="#82a9ff" stroke-width="2.5"/>
    <path d="M995 232 H1029" stroke="#55cde6" stroke-width="2.7" marker-end="url(#arrowBlue)"/>
  </g>
  <circle cx="265" cy="232" r="4" fill="#b3caff"/>
  <circle cx="800" cy="232" r="4" fill="#b3caff"/>

  <!-- Source AI client -->
  <rect x="34" y="168" width="200" height="128" rx="17" fill="#29233e" stroke="#7560b0" stroke-opacity=".8"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <circle cx="134" cy="203" r="19" fill="#9f81f7" fill-opacity=".15"/>
    <path d="M125 194 h17 a5 5 0 0 1 5 5 v9 h-10 l-6 6 v-6 h-6 a5 5 0 0 1 -5 -5 v-4 a5 5 0 0 1 5 -5" stroke="#b496ff" stroke-width="2.2" fill="none"/>
    <text x="134" y="251" font-size="21" font-weight="730" fill="#f7f4ff">ChatGPT</text>
    <text x="134" y="274" font-size="12" fill="#c4b7e0">Remote MCP client</text>
  </g>

  <!-- Primary route: direct HTTPS -->
  <rect x="295" y="105" width="478" height="125" rx="15" fill="url(#direct)" stroke="#50c9b2" stroke-width="1.8"/>
  <rect x="316" y="123" width="125" height="23" rx="11.5" fill="#245749" stroke="#49c5a5" stroke-opacity=".55"/>
  <text x="378" y="139" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="750" font-size="12" fill="#b6ffe6">01 · PREFERRED</text>
  <text x="454" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="730" font-size="18" fill="#f3fefd">Direct HTTPS</text>
  <text x="317" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" fill="#d8f6ee">DNS A / AAAA  →  TLS :443  →  Auth</text>
  <text x="317" y="201" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#94d9c8">Your reachable IP · your domain · your proxy</text>
  <g transform="translate(725 125)" fill="none" stroke="#6de0c6" stroke-width="2.2">
    <path d="M0 10 v-5 a7 7 0 0 1 14 0 v5"/><rect x="-3" y="10" width="20" height="17" rx="3"/>
    <circle cx="7" cy="17" r="1.6" fill="#6de0c6"/><path d="M7 18 v4"/>
  </g>

  <!-- Secondary route: OpenAI Tunnel -->
  <rect x="295" y="250" width="478" height="125" rx="15" fill="url(#tunnel)" stroke="#637fc4" stroke-width="1.7"/>
  <rect x="316" y="268" width="137" height="23" rx="11.5" fill="#304375" stroke="#7f98e5" stroke-opacity=".65"/>
  <text x="384.5" y="284" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="730" font-size="12" fill="#bed0ff">02 · ALTERNATIVE</text>
  <text x="467" y="285" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="730" font-size="18" fill="#f0f3ff">Secure MCP Tunnel</text>
  <text x="317" y="320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" fill="#d7e6ff">OpenAI Tunnel  ↔  outbound tunnel-client</text>
  <text x="317" y="345" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" fill="#a5b7e3">No inbound router port · OpenAI relay required</text>
  <g transform="translate(728 276)" stroke="#97b6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-2 6 h20 m-5 -5 l5 5 -5 5 M18 18 h-20 m5 -5 l-5 5 5 5"/>
  </g>

  <!-- Single local gateway -->
  <rect x="824" y="168" width="171" height="128" rx="17" fill="url(#gateway)" stroke="#6589dc" stroke-width="1.8"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <circle cx="910" cy="203" r="18" fill="#73b4f8" fill-opacity=".15"/>
    <g stroke="#a5d6ff" fill="none" stroke-width="2">
      <circle cx="901" cy="198" r="3"/><circle cx="920" cy="198" r="3"/><circle cx="910" cy="213" r="3"/>
      <path d="M904 201 l4 9 m9 -9 l-4 9 m-9 -12 h13"/>
    </g>
    <text x="910" y="251" font-size="17" font-weight="730" fill="#eff7ff">Mac MCP</text>
    <text x="910" y="272" font-size="17" font-weight="730" fill="#eff7ff">Gateway</text>
    <text x="910" y="286" font-size="10" fill="#a8cbed">One local Core</text>
  </g>

  <!-- Real upstream server -->
  <rect x="1032" y="168" width="145" height="128" rx="17" fill="#13343b" stroke="#54a7b8" stroke-width="1.6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="1089" y="189" width="30" height="29" rx="4" fill="#5ac1cf" fill-opacity=".12" stroke="#6fdee3" stroke-width="1.8"/>
    <path d="M1095 198 h18 M1095 205 h18 M1095 212 h10" stroke="#6fdee3" stroke-width="1.7"/>
    <text x="1104.5" y="248" font-size="16" font-weight="720" fill="#efffff">Desktop</text>
    <text x="1104.5" y="269" font-size="16" font-weight="720" fill="#efffff">Commander</text>
    <text x="1104.5" y="286" font-size="10.5" fill="#aad2d6">Actual MCP tools</text>
  </g>

  <!-- Explanatory footer -->
  <path d="M34 405 H1177" stroke="#426078" stroke-opacity=".6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <circle cx="42" cy="423" r="4.5" fill="#5cddc3"/>
    <text x="56" y="428" font-size="13" fill="#c2dce8">Both routes reach the same self-hosted Core. External authentication and reachability must be verified separately.</text>
  </g>
</svg>