<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
  <title id="title">Mac MCP Gateway: remote AI clients connect to real Mac tools</title>
  <desc id="desc">One clear flow: compatible remote AI clients, such as ChatGPT, connect over authenticated Direct HTTPS or OpenAI Secure MCP Tunnel to a self-hosted Mac MCP Gateway, which routes approved MCP tool requests to the real Desktop Commander MCP server on that Mac.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111629"/><stop offset="1" stop-color="#0d2432"/></linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29223f"/><stop offset="1" stop-color="#201e3c"/></linearGradient>
    <linearGradient id="cardNavy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263456"/><stop offset="1" stop-color="#1b2c4a"/></linearGradient>
    <linearGradient id="cardTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173941"/><stop offset="1" stop-color="#17313b"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M1 1 L5.8 3.5 L1 6" stroke="#69b5fa" stroke-width="1.8" stroke-linecap="round" fill="none"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="405" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="403" rx="21" fill="none" stroke="#405675" stroke-opacity=".7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="36" y="47" font-weight="740" font-size="27" fill="#f7fbff">Your AI. Your Mac. Your tools.</text>
    <text x="36" y="76" font-size="15" fill="#a6bed5">Authorized remote MCP calls reach real files, Git and Shell on the Mac you control.</text>
    <!-- Mac region: Gateway and its real upstream remain on the machine -->
    <rect x="588" y="117" width="580" height="214" rx="20" fill="#2b4765" fill-opacity=".13" stroke="#648aac" stroke-opacity=".48" stroke-dasharray="5 6"/>
    <text x="606" y="140" font-weight="750" font-size="11" letter-spacing="1.4" fill="#8fbad8">ON YOUR MAC</text>
    <!-- Client card -->
    <rect x="36" y="157" width="224" height="157" rx="16" fill="url(#cardPurple)" stroke="#63558d"/>
    <g transform="translate(131 175)" fill="none" stroke="#b49aff" stroke-width="2.5" stroke-linejoin="round"><rect width="35" height="25" x="-16" y="0" rx="5"/><path d="M-6 25 v7 l9 -7"/></g>
    <text x="148" y="230" fill="#f5f2fe" font-size="19" font-weight="730" text-anchor="middle">Remote AI client</text>
    <text x="148" y="256" fill="#c1b5de" font-size="14" text-anchor="middle">ChatGPT web</text>
    <text x="148" y="277" fill="#a99fc8" font-size="12.5" text-anchor="middle">or compatible MCP client</text>
    <!-- Connectivity card -->
    <rect x="298" y="157" width="252" height="157" rx="16" fill="#1b2941" stroke="#4d7095"/>
    <text x="424" y="186" fill="#e2efff" font-size="17" font-weight="740" text-anchor="middle">Your connection</text>
    <rect x="316" y="200" width="216" height="43" rx="10" fill="#1b4a47" stroke="#41bda0" stroke-opacity=".8"/>
    <circle cx="333" cy="221" r="5.5" fill="#56e1bd"/>
    <text x="351" y="226" fill="#d9fff5" font-size="15" font-weight="720">Direct HTTPS</text>
    <text x="521" y="225" fill="#99d9c8" font-size="10" text-anchor="end">PREFERRED</text>
    <rect x="316" y="252" width="216" height="43" rx="10" fill="#292c53" stroke="#7584d6" stroke-opacity=".85"/>
    <circle cx="333" cy="273" r="5.5" fill="#9a9dfc"/>
    <text x="351" y="278" fill="#ecebff" font-size="15" font-weight="720">Secure Tunnel</text>
    <!-- Gateway card -->
    <rect x="606" y="157" width="259" height="157" rx="16" fill="url(#cardNavy)" stroke="#7095dd" stroke-width="1.5"/>
    <g transform="translate(719 178)" stroke="#9acaff" stroke-width="2.5" fill="none"><circle cx="0" cy="0" r="5"/><circle cx="22" cy="0" r="5"/><circle cx="11" cy="23" r="5"/><path d="M5 3 l4 15 M17 3 l-4 15 M6 0 h10"/></g>
    <text x="735" y="239" fill="#f5f9ff" font-weight="760" font-size="20" text-anchor="middle">Mac MCP Gateway</text>
    <text x="735" y="265" fill="#bdd5ef" font-size="13.5" text-anchor="middle">Self-hosted entry point</text>
    <text x="735" y="287" fill="#91b1d8" font-size="12.5" text-anchor="middle">Access + routing</text>
    <!-- Upstream card -->
    <rect x="904" y="157" width="245" height="157" rx="16" fill="url(#cardTeal)" stroke="#52a6b2" stroke-width="1.5"/>
    <rect x="1009" y="178" width="32" height="29" rx="5" fill="none" stroke="#70dfdf" stroke-width="2.5"/>
    <path d="M1016 187 h18 M1016 193 h18 M1016 199 h10" fill="none" stroke="#70dfdf" stroke-width="2"/>
    <text x="1026" y="239" fill="#eafaff" font-weight="750" font-size="18" text-anchor="middle">Desktop Commander</text>
    <text x="1026" y="265" fill="#b9dce0" font-size="13.5" text-anchor="middle">Real MCP server</text>
    <text x="1026" y="286" fill="#94c3c9" font-size="12.5" text-anchor="middle">Files · Git · Terminal</text>
    <!-- Flow arrows -->
    <g stroke="#69b5fa" stroke-width="2.7" stroke-linecap="round" fill="none">
      <path d="M264 236 H291" marker-end="url(#arrow)"/>
      <path d="M554 236 H599" marker-end="url(#arrow)"/>
      <path d="M869 236 H897" marker-end="url(#arrow)"/>
    </g>
    <!-- Caveat, small and clear -->
    <path d="M36 348 H1166" stroke="#4c6482" stroke-opacity=".5"/>
    <circle cx="43" cy="369" r="5" fill="#5bddbd"/>
    <text x="56" y="374" fill="#bad5e5" font-size="13">Direct HTTPS: your domain + authentication</text>
    <circle cx="460" cy="369" r="5" fill="#9b9cf2"/>
    <text x="473" y="374" fill="#bad5e5" font-size="13">Tunnel: uses OpenAI forwarding</text>
    <text x="1160" y="374" fill="#799eb9" font-size="12.5" text-anchor="end">One Gateway · One Mac</text>
  </g>
</svg>
